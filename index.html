<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#687176">
  <title>꿈과 희망 | 행정사무소</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #fff;
      --muted: rgba(255, 255, 255, .78);
      --accent: #df8ea8;
      --photo-base: #6d767b;
      --ease: cubic-bezier(.22, .68, 0, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: #f2f3f2;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { color: inherit; font: inherit; }

    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: var(--photo-base);
    }
    .hero-video {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background-color: var(--photo-base);
    }
    .hero-shade {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 20, 24, .44), rgba(15, 20, 24, .34) 48%, rgba(15, 20, 24, .46));
      transition: background .4s ease;
      pointer-events: none;
    }
    .hero.is-scrolled .hero-shade {
      background: linear-gradient(180deg, rgba(15, 20, 24, .50), rgba(15, 20, 24, .40) 48%, rgba(15, 20, 24, .52));
    }

    .site-header {
      position: fixed;
      z-index: 20;
      inset: 0 0 auto;
      min-height: 76px;
      display: grid;
      grid-template-columns: clamp(150px, 12vw, 218px) minmax(0, 1fr) 46px;
      align-items: center;
      gap: clamp(16px, 3vw, 48px);
      padding: 0 clamp(22px, 3.2vw, 58px);
      border-bottom: 1px solid rgba(255, 255, 255, .18);
      background: rgba(35, 42, 46, .12);
      transition: background .3s ease, min-height .3s ease, border-color .3s ease;
    }
    .site-header.is-scrolled {
      min-height: 76px;
      background: #fff;
      border-color: rgba(25, 28, 31, .08);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .site-header.menu-open,
    .site-header.menu-open.is-scrolled {
      background: #fff;
      border-color: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    .site-header.menu-open .main-nav {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-space {
      display: block;
      width: clamp(150px, 12vw, 218px);
      height: 46px;
      transition: opacity .22s ease, visibility .22s ease;
    }
    .logo-space img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left center;
    }
    .site-header.menu-open .logo-space {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .main-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
      width: 100%;
      gap: 0;
      transition: opacity .22s ease, visibility .22s ease;
    }
    .main-nav a {
      min-width: 0;
      padding: 14px 0;
      color: rgba(255, 255, 255, .9);
      font-size: clamp(14px, .92vw, 17px);
      font-weight: 600;
      letter-spacing: .045em;
      text-align: center;
      transition: color .2s ease, opacity .2s ease;
    }
    .site-header.is-scrolled .main-nav a { color: #202427; }
    .main-nav a:hover,
    .main-nav a:focus-visible { color: #fff; opacity: .68; }
    .site-header.is-scrolled .main-nav a:hover,
    .site-header.is-scrolled .main-nav a:focus-visible { color: #000; }
    .nav-mega-menu {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      max-height: 0;
      overflow: hidden;
      padding: 0 calc(clamp(22px, 3.2vw, 58px) + 46px + clamp(16px, 3vw, 48px)) 0 calc(clamp(22px, 3.2vw, 58px) + clamp(150px, 12vw, 218px) + clamp(16px, 3vw, 48px));
      background: rgba(255, 255, 255, .62);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
      border-top: 1px solid rgba(25, 28, 31, .08);
      box-shadow: 0 20px 36px rgba(18, 24, 28, .12);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: max-height .58s cubic-bezier(.2, .75, .25, 1), padding .58s cubic-bezier(.2, .75, .25, 1), opacity .28s ease, visibility 0s linear .58s;
    }
    .site-header.has-mega-open .nav-mega-menu {
      max-height: 220px;
      padding-top: 26px;
      padding-bottom: 30px;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: max-height .58s cubic-bezier(.2, .75, .25, 1), padding .58s cubic-bezier(.2, .75, .25, 1), opacity .28s ease, visibility 0s;
    }
    .mega-menu-group { min-width: 0; text-align: center; }
    .mega-menu-links {
      display: grid;
      gap: 10px;
      padding: 14px 8px 0;
    }
    .mega-menu-links a {
      color: #60686d;
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
      transition: color .18s ease;
    }
    .mega-menu-links a:hover,
    .mega-menu-links a:focus-visible { color: #111; }

    .menu-toggle {
      justify-self: end;
      width: 46px;
      height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }
    .menu-toggle span {
      width: 23px;
      height: 2px;
      flex: 0 0 2px;
      display: block;
      border-radius: 999px;
      background: #fff;
      transform-origin: center;
      transition: transform .25s ease, opacity .2s ease, background .25s ease;
    }
    .site-header.is-scrolled .menu-toggle span { background: #202427; }
    .menu-toggle:hover span { opacity: .7; }
    .menu-toggle[aria-expanded="true"] span:nth-child(1) {
      width: 23px;
      transform: translateY(3.5px) rotate(45deg);
    }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) {
      width: 23px;
      transform: translateY(-3.5px) rotate(-45deg);
    }
    .site-header.menu-open .menu-toggle span { background: #000; }
    .site-header.menu-open .menu-toggle[aria-expanded="true"] span:nth-child(1),
    .site-header.menu-open .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 1; }

    .menu-overlay {
      position: fixed;
      z-index: 19;
      inset: 0;
      display: block;
      overflow-y: scroll;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: 0 24px;
      background: #fff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .28s ease, visibility 0s linear .28s;
    }
    .menu-overlay::after {
      content: "";
      display: block;
      height: max(0px, calc(var(--menu-overlay-scroll-height, 162vh) - 100vh));
    }
    .menu-overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity .28s ease, visibility 0s;
    }
    .overlay-nav {
      position: fixed;
      z-index: 1;
      top: calc(50% + 35px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(680px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 54px;
    }
    .overlay-nav a {
      padding: 18px 2px;
      border-bottom: 1px solid rgba(25, 28, 31, .14);
      color: #202427;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 500;
      letter-spacing: .04em;
    }
    .hero-copy {
      width: min(1000px, calc(100% - 48px));
      margin: 44px auto 0;
      text-align: center;
    }
    .hero-title {
      margin: 0;
      color: #fff;
      font-size: clamp(40px, 5vw, 76px);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -.015em;
      text-wrap: balance;
    }
    .hero-rule {
      width: 42px;
      height: 1px;
      margin: 22px auto 18px;
      background: rgba(255, 255, 255, .68);
    }
    .hero-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 1.25vw, 21px);
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: .005em;
    }

    .scroll-cue {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: clamp(27px, 4.5vh, 50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, .9);
      font-size: 13px;
      letter-spacing: .02em;
      pointer-events: none;
      user-select: none;
      cursor: default;
      transform: translateX(-50%);
      opacity: 1;
      transition: opacity .45s ease, transform .45s var(--ease), visibility .45s ease;
    }
    .scroll-cue.is-hidden {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 10px);
      pointer-events: none;
    }
    .scroll-arrow {
      width: 17px;
      height: 20px;
      display: block;
      animation: arrow-bob 1.25s ease-in-out infinite;
    }
    @keyframes arrow-bob {
      0%, 100% { transform: translateY(-3px); }
      50% { transform: translateY(6px); }
    }

    .next-section {
      min-height: 62vh;
      background: #f2f3f2;
    }

    @media (max-width: 900px) {
      .site-header {
        grid-template-columns: 146px minmax(0, 1fr) 46px;
        gap: 18px;
        padding-inline: 22px;
      }
      .logo-space { width: 146px; }
      .main-nav { gap: 0; }
      .main-nav a { min-width: 0; font-size: 14px; }
      .nav-mega-menu {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        padding-left: calc(22px + 146px + 18px);
        padding-right: calc(22px + 46px + 18px);
      }
      .mega-menu-links { padding-inline: 3px; }
      .mega-menu-links a { font-size: 11px; }
    }
    @media (max-width: 700px) {
      .site-header { min-height: 68px; grid-template-columns: 1fr 46px; }
      .site-header.is-scrolled { min-height: 68px; }
      .logo-space { width: 150px; height: 42px; }
      .main-nav { display: none; }
      .nav-mega-menu { display: none; }
      .menu-overlay { padding-top: 0; }
      .overlay-nav { top: calc(50% + 25px); }
      .overlay-nav { gap: 0 24px; }
      .overlay-nav a { padding: 16px 0; font-size: clamp(20px, 6vw, 28px); }
      .hero-copy { width: calc(100% - 36px); margin-top: 32px; }
      .hero-title { font-size: clamp(34px, 9vw, 56px); }
      .hero-rule { margin: 18px auto 14px; }
      .hero-subtitle { font-size: 17px; }
      .scroll-cue { bottom: 26px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

      <video class="hero-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="11955057_3840_2160_25fps.mp4" type="video/mp4">
      </video>
      <div class="hero-shade" aria-hidden="true"></div>



      <div class="hero-copy">
        <h1 class="hero-title">텍스트 들어갈 부분</h1>
        <div class="hero-rule" aria-hidden="true"></div>
        <p class="hero-subtitle">텍스트 들어갈 부분</p>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <svg class="scroll-arrow" viewBox="0 0 20 24" fill="none" aria-hidden="true">
          <path d="M10 2v17M3.5 13.5 10 20l6.5-6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Scroll Down</span>
      </div>
    </section>

    <section class="next-section" id="next" aria-label="다음 콘텐츠 영역"></section>
  </main>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <nav class="overlay-nav" aria-label="전체 메뉴">
        <a href="office(1).html">사무소 소개</a>
        <a href="business(1).html">업무 분야</a>
        <a href="process(1).html">업무 절차</a>
        <a href="blog(1).html">블로그</a>
        <a href="contact(1).html">상담 문의</a>
      </nav>
  </div>

  <script>
    const header = document.querySelector('.site-header');
    const hero = document.querySelector('.hero');
    const scrollCue = document.querySelector('.scroll-cue');
    const menuToggle = document.querySelector('.menu-toggle');
    const menuOverlay = document.querySelector('.menu-overlay');
    const heroVideo = document.querySelector('.hero-video');
    const mainNav = document.querySelector('.main-nav');
    const megaMenu = document.querySelector('.nav-mega-menu');
    let megaMenuCloseTimer;

    function openMegaMenu() {
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches ||
          menuToggle.getAttribute('aria-expanded') === 'true') return;
      window.clearTimeout(megaMenuCloseTimer);
      header.classList.add('has-mega-open');
    }
    function scheduleMegaMenuClose() {
      window.clearTimeout(megaMenuCloseTimer);
      megaMenuCloseTimer = window.setTimeout(() => {
        header.classList.remove('has-mega-open');
      }, 160);
    }
    function closeMegaMenu() {
      window.clearTimeout(megaMenuCloseTimer);
      header.classList.remove('has-mega-open');
    }
    mainNav.addEventListener('mouseenter', openMegaMenu);
    mainNav.addEventListener('mouseleave', scheduleMegaMenuClose);
    megaMenu.addEventListener('mouseenter', openMegaMenu);
    megaMenu.addEventListener('mouseleave', scheduleMegaMenuClose);
    megaMenu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', closeMegaMenu);
    });

    function setBackgroundVideoSpeed() {
      heroVideo.playbackRate = 0.85;
    }
    setBackgroundVideoSpeed();
    heroVideo.addEventListener('loadedmetadata', setBackgroundVideoSpeed);

    function updateScrollState() {
      const scrolled = window.scrollY > 50;
      header.classList.toggle('is-scrolled', scrolled);
      hero.classList.toggle('is-scrolled', scrolled);
      scrollCue.classList.toggle('is-hidden', scrolled);
    }
    updateScrollState();
    window.addEventListener('scroll', updateScrollState, { passive: true });

    function setMenuOpen(open) {
      if (open) closeMegaMenu();
      if (open) {
        const pageScrollHeight = document.documentElement.scrollHeight;
        const pageScrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
        menuOverlay.style.setProperty('--menu-overlay-scroll-height', `${pageScrollHeight}px`);
        header.style.right = pageScrollbarWidth > 0 ? `${pageScrollbarWidth}px` : '';
        menuOverlay.scrollTop = 0;
      } else {
        header.style.right = '';
      }
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? '전체 메뉴 닫기' : '전체 메뉴 열기');
      header.classList.toggle('menu-open', open);
      menuOverlay.classList.toggle('is-open', open);
      menuOverlay.setAttribute('aria-hidden', String(!open));
      document.body.style.overflow = open ? 'hidden' : '';
    }
    menuToggle.addEventListener('click', () => {
      setMenuOpen(menuToggle.getAttribute('aria-expanded') !== 'true');
    });
    menuOverlay.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => setMenuOpen(false));
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setMenuOpen(false);
    });
  </script>
</body>
</html>
